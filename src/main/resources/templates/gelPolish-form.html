<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gel Polish Form</title>
</head>
<body>
<!-- Replace this div entirely with our reusable header fragment -->
<div th:replace="~{fragments/navbar :: header}"></div>

<!-- rest of HTML view -->

<h1 th:text="${polish.id == null} ? 'Add New Polish' : 'Edit Polish'">Add/Edit Polish</h1>

<form th:action="@{/polishes/save}" th:object="${polish}" method="post">

    <!-- HIDDEN KEY: Critical for Updates to prevent duplicating records -->
    <input type="hidden" th:field="*{id}" />

    <label>Colour:</label><br/>
    <input type="text" th:field="*{colourShade}" required />
    <br/><br/>

    <label>Finish:</label><br/>
    <input type="text" th:field="*{texture}" required />
    <br/><br/>

    <label>Price:</label><br/>
    <input type="number" step="0.01" th:field="*{price}" required />
    <br/><br/>

    <button type="submit">Save Polish</button>
</form>

<br/>
<a th:href="@{/polishes}">Cancel and go back</a>
</body>
</html>
