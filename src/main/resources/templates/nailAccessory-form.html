<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nail Accessory Form</title>
</head>
<body>
<!-- Replace this div entirely with our reusable header fragment -->
<div th:replace="~{fragments/navbar :: header}"></div>

<!-- rest of HTML view -->

<h1 th:text="${accessory.id == null} ? 'Add New Accessory' : 'Edit Accessory'">Add/Edit Accessory</h1>

<form th:action="@{/accessories/save}" th:object="${accessory}" method="post">

    <!-- HIDDEN KEY: Critical for Updates to prevent duplicating records -->
    <input type="hidden" th:field="*{id}" />

    <label>Accessory Type:</label><br/>
    <input type="text" th:field="*{accessoryType}" required />
    <br/><br/>

    <label>Price:</label><br/>
    <input type="number" step="0.01" th:field="*{price}" required />
    <br/><br/>

    <button type="submit">Save Accessory</button>
</form>

<br/>
<a th:href="@{/books}">Cancel and go back</a>
</body>
</html>
